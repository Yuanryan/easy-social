{% extends "base.html" %}
{% block title %}Register - 陳宥安's Easy Social{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Create account</h1>
    <form method="post" class="form-stack">
      <label>
        Username
        <input name="username" maxlength="40" autocomplete="username" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" required>
      </label>
      <div class="captcha-field">
        <label class="captcha-label" for="captcha">Verification code</label>
        <div class="captcha-row">
          <img
            src="{{ url_for('auth.captcha_image') }}"
            alt="Verification code image"
            id="captcha-image"
            class="captcha-image"
            width="180"
            height="60"
          >
          <button type="button" class="link-button" id="captcha-refresh" aria-label="Refresh verification code">
            Refresh
          </button>
        </div>
        <input
          name="captcha"
          maxlength="5"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Enter the 5 characters above"
          required
        >
      </div>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </section>
  <script>
    (function () {
      var refresh = document.getElementById('captcha-refresh');
      var image = document.getElementById('captcha-image');
      if (refresh && image) {
        refresh.addEventListener('click', function () {
          image.src = '{{ url_for("auth.captcha_image") }}?_=' + Date.now();
        });
      }
    })();
  </script>
{% endblock %}
